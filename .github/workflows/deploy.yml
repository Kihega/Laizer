# ============================================================
# SMSS — Deploy: Push to main
# Triggered when a PR from develop is merged into main.
# Fires the Render deploy hook to redeploy the backend API.
# ============================================================
name: Deploy — Production

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  # ── Job 1: Run backend tests one final time before deploy ──
  pre-deploy-test:
    name: Pre-deploy — Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/smss_ci"
      DIRECT_URL: "postgresql://postgres:dummy@localhost:5432/smss_ci"
      SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      REDIS_URL: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # ── Job 2: Trigger Render deploy ──────────────────────────
  deploy-backend:
    name: Deploy — Render Backend
    runs-on: ubuntu-latest
    needs: pre-deploy-test   # only deploy if tests pass

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "🚀 Triggering Render deploy..."
          HTTP_STATUS=$(curl -s -o /tmp/render_response.txt -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response (HTTP $HTTP_STATUS):"
          cat /tmp/render_response.txt
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Deploy triggered successfully."
          else
            echo "❌ Deploy hook returned HTTP $HTTP_STATUS."
            exit 1
          fi

  # ── Job 3: Notify outcome ─────────────────────────────────
  notify:
    name: Notify — Deploy Status
    runs-on: ubuntu-latest
    needs: [pre-deploy-test, deploy-backend]
    if: always()

    steps:
      - name: Report success
        if: needs.deploy-backend.result == 'success'
        run: |
          echo "✅ SMSS backend deployed to Render successfully."
          echo "   URL: https://laizer.onrender.com"
          echo "   Health: https://laizer.onrender.com/api/health/"

      - name: Report failure
        if: needs.deploy-backend.result != 'success'
        run: |
          echo "❌ Deploy failed. Check the logs above."
          exit 1
