# ============================================================
# SMSS — CI: PR Checks
# Runs on every Pull Request targeting `main` (from develop).
# Validates backend tests pass and mobile type-checks clean.
# ============================================================
name: CI — PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "mobile/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Backend lint + tests ────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Tests use mocked Prisma/Redis — these dummy values satisfy
      # prisma generate and config validation without a real DB.
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/smss_ci"
      DIRECT_URL: "postgresql://postgres:dummy@localhost:5432/smss_ci"
      SECRET_KEY: "ci-test-secret-key-not-used-in-production"
      REDIS_URL: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        # Does NOT connect to DB — only reads schema to generate types.
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ── Job 2: Mobile type check ───────────────────────────────
  mobile:
    name: Mobile — Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true   # type errors are warnings until codebase is 100% typed
